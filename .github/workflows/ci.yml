name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    name: API - Rails tests (MySQL, Redis, Elasticsearch)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root}
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: --health-cmd "curl -fs http://localhost:9200/_cluster/health" --health-interval 5s --health-retries 30
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_PASSWORD: root
      REDIS_URL: redis://localhost:6379/1
      ELASTICSEARCH_URL: http://localhost:9200
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: api
      - name: Create and migrate the MySQL database
        run: bin/rails db:create db:migrate
      - name: Run the tests
        run: bin/rails test -v

  mobile:
    name: Mobile - React Native (type check, Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  web:
    name: Web - AngularJS dashboard (Jest, ngMock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx jest --ci
